name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./internal/...
      - name: Build
        run: |
          mkdir -p out
          for c in wicker-collector wicker-archiver wicker-checks trialrec; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o out/$c ./cmd/$c
          done
          cp deploy/* config/*.example out/
          (cd out && sha256sum * > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wicker-linux-amd64
          path: out/
          retention-days: 7
          if-no-files-found: error
